<style>
/* Layout: a lab-log index of rolls (one row per roll, grouped by year) that opens into the roll's contact sheet and its frames; single frames open in a dark loupe. */
:root{
  --paper:#F2F2EF;
  --surface:#FFFFFF;
  --sunk:#E6E4DF;
  --ink:#171614;
  --muted:#6C675F;
  --line:#D8D5CE;
  --accent:#A94F17;      /* film-base orange */
  --accent-ink:#FFFFFF;
  --display:"Archivo","Arial Narrow",Helvetica,Arial,sans-serif;
  --body:"Archivo",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --step--1:.8125rem; --step-0:1rem; --step-1:1.25rem; --step-2:1.75rem; --step-3:clamp(2.25rem,6vw,4.25rem);
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --sunk:#201F1C; --ink:#ECE9E3; --muted:#958F86;
    --line:#2C2A27; --accent:#E8914A; --accent-ink:#1A1208; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121110; --surface:#1A1917; --sunk:#201F1C; --ink:#ECE9E3; --muted:#958F86;
  --line:#2C2A27; --accent:#E8914A; --accent-ink:#1A1208; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:var(--step-0); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s, color .25s;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.mono{font-family:var(--mono);font-size:var(--step--1);letter-spacing:.02em}
.wrap{
  max-width:var(--wrap); margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- Header / wordmark ---------- */
.top{padding-block:22px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{display:inline-flex; align-items:center; gap:12px; text-decoration:none; min-width:0}
.brand svg{width:38px; height:27px; flex:none; color:var(--ink)}
.brand .word{display:flex; flex-direction:column; line-height:1; min-width:0}
.brand b{
  font-family:var(--display); font-weight:780; font-stretch:125%;
  font-size:1.0625rem; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
}
.brand small{font-family:var(--mono); font-size:.6875rem; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:5px}
.top-right{display:flex; align-items:center; gap:18px; flex:none}
.top .meta{color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:.6875rem}
.theme{
  display:inline-grid; place-items:center; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--ink);
}
.theme:hover{border-color:var(--ink)}
.theme svg{width:17px; height:17px}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme .sun{display:none}
  :root:not([data-theme="light"]) .theme .moon{display:block}
}
@media (max-width:560px){ .top .meta{display:none} }

.demo{
  display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  border:1px dashed var(--line); border-radius:6px; padding:10px 14px; margin:0 0 8px;
  color:var(--muted); font-size:var(--step--1);
}
.demo strong{color:var(--accent); font-family:var(--mono); font-weight:500; text-transform:uppercase; letter-spacing:.1em; font-size:.6875rem}

/* ---------- Home ---------- */
.intro{padding-block:48px 28px; display:grid; gap:18px}
.rule{height:1px; background:var(--ink); border:0; margin:0}
.intro h1{
  font-family:var(--display); font-weight:300; font-stretch:112%;
  font-size:var(--step-3); line-height:1.02; letter-spacing:-.02em; margin:0; max-width:16ch; text-wrap:balance;
}
.intro h1 em{font-style:normal; font-weight:760; font-stretch:125%}
.intro p{margin:0; max-width:56ch; color:var(--muted)}
.stats{display:flex; gap:22px; flex-wrap:wrap; text-transform:uppercase; letter-spacing:.1em; color:var(--ink); font-size:.75rem}
.stats span b{font-weight:500; color:var(--accent)}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-block:18px}
.filters .lbl{font-family:var(--mono); font-size:.6875rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:6px}
.chip{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:5px 13px; font-family:var(--mono); font-size:var(--step--1); cursor:pointer; white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip .n{font-size:.6875rem; opacity:.6; margin-left:5px}

.year{margin-top:18px}
.year h2{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  font-family:var(--display); font-weight:760; font-stretch:125%; font-size:var(--step-1);
  margin:0; padding-block:14px 10px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--paper); z-index:2;
}
.year h2 span{font-family:var(--mono); font-weight:400; font-stretch:100%; font-size:.75rem; color:var(--muted); letter-spacing:.06em}
.rolls{list-style:none; margin:0; padding:0}
.roll{
  display:grid; align-items:baseline; gap:4px 20px; text-decoration:none;
  grid-template-columns:4.5rem 4.5rem minmax(0,1fr) 7.5rem 10rem 3.5rem 1.25rem;
  grid-template-areas:"no date film iso cam fr go";
  padding-block:15px; border-bottom:1px solid var(--line);
  transition:background-color .15s;
}
.roll:hover{background:var(--sunk)}
.roll > *{min-width:0}
.r-no{grid-area:no; font-family:var(--mono); font-size:var(--step--1); color:var(--muted); padding-left:6px; font-variant-numeric:tabular-nums}
.r-date{grid-area:date; font-family:var(--mono); font-size:var(--step--1); font-variant-numeric:tabular-nums}
.r-film{grid-area:film; font-weight:600; font-size:var(--step-1); line-height:1.25; letter-spacing:-.005em}
.r-film em{display:block; font-style:normal; font-weight:400; font-size:var(--step--1); color:var(--muted); margin-top:2px; letter-spacing:0}
.r-iso{grid-area:iso; font-family:var(--mono); font-size:var(--step--1); white-space:nowrap}
.r-cam{grid-area:cam; font-size:var(--step--1); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.r-fr{grid-area:fr; font-family:var(--mono); font-size:var(--step--1); color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.r-go{grid-area:go; color:var(--muted); transition:transform .2s, color .2s}
.roll:hover .r-go{transform:translateX(3px); color:var(--accent)}
.push{font-style:normal; color:var(--accent); margin-left:6px; font-size:.6875rem; border:1px solid currentColor; border-radius:3px; padding:0 4px}
.empty{padding-block:40px; color:var(--muted)}

@media (max-width:760px){
  .roll{
    grid-template-columns:auto auto minmax(0,1fr) auto;
    grid-template-areas:"film film film go" "date iso fr go";
    align-items:center; gap:4px 16px; padding-block:13px;
  }
  .r-no,.r-cam{display:none}
  .r-film{font-size:var(--step-0)}
  .r-fr{text-align:left}
}
@media (hover:none){ .roll:hover{background:transparent} .roll:hover .r-go{transform:none} }
@media (max-width:760px){
  .intro{padding-block:26px 20px; gap:14px}
  .stats{gap:14px}
  .filters{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    margin-inline:-16px; padding-inline:16px; padding-block:14px}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none; padding:7px 14px}
  .filters .lbl{flex:none}
  .back{padding-block:12px 4px; min-height:44px}
  .demo{font-size:.75rem; padding:8px 12px}
  .top{padding-block:16px 14px}
  footer{flex-direction:column; padding-block:40px 28px}
}

/* ---------- Roll page ---------- */
.back{display:inline-flex; gap:8px; align-items:center; text-decoration:none; color:var(--muted); font-size:var(--step--1); padding-block:18px 0}
.back:hover{color:var(--ink)}
.roll-head{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px 40px; align-items:end; padding-block:22px 30px}
.eyebrow{color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; margin:0 0 10px}
.stock{
  font-family:var(--display); font-weight:780; font-stretch:125%;
  font-size:var(--step-3); line-height:.98; letter-spacing:-.015em; margin:0; text-wrap:balance;
}
.roll-title{margin:12px 0 0; font-size:var(--step-1); color:var(--muted); font-weight:300}
.desc{margin:18px 0 0; max-width:62ch; font-size:1.0625rem; line-height:1.65; white-space:pre-line}
.specs{display:flex; gap:28px; flex-wrap:wrap; margin:22px 0 0}
.specs div{display:grid; gap:2px}
.specs dt{font-family:var(--mono); font-size:.6875rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.specs dd{margin:0; font-weight:600}
.specs .pp{font-family:var(--mono); font-weight:500; color:var(--accent); font-size:var(--step--1); margin-left:4px}
.actions{display:flex; flex-direction:column; gap:8px; align-items:stretch; min-width:230px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:4px; border:1px solid var(--ink);
  text-decoration:none; font-weight:600; font-size:var(--step--1); cursor:pointer; background:transparent;
  white-space:nowrap;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:not(.primary):hover{background:var(--sunk)}
.btn.sm{padding:7px 12px}
.hint{font-size:.75rem; color:var(--muted); max-width:30ch; margin:2px 0 0}

/* contact sheet */
.cs{border-top:1px solid var(--ink); padding-block:14px 40px}
.cs-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.cs-bar h2{margin:0; font-family:var(--mono); font-weight:500; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase}
.cs-bar h2 span{color:var(--muted); font-weight:400}
.cs-img{
  display:block; width:100%; max-width:100%; padding:0; border:0; cursor:zoom-in;
  background:var(--sunk); border-radius:2px; overflow:hidden; position:relative; min-height:220px;
}
.cs-img img{display:block; width:auto; max-width:100%; height:auto; max-height:88vh; margin-inline:auto; opacity:0; transition:opacity .35s}
.cs-img:has(img.in){background:transparent; min-height:0; aspect-ratio:auto!important}
.cs-img img.in{opacity:1}
.cs-img .err{position:absolute; inset:0; display:grid; place-items:center; font-size:.75rem; color:var(--muted); padding:12px; text-align:center}

.frames-head{display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap; margin-bottom:0}
.frames-head h2{margin:0; font-family:var(--mono); font-weight:500; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; padding-block:14px 0}
.edge{
  font-family:var(--mono); font-size:.6875rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); white-space:nowrap; overflow:hidden; padding-block:8px;
  border-bottom:1px solid var(--line);
}
.frames{border-top:1px solid var(--ink)}
.sheet{
  --rh:210px; --gap:6px;
  list-style:none; margin:0; padding:16px 0 0;
  display:flex; flex-wrap:wrap; gap:var(--gap);
}
.sheet::after{content:""; flex-grow:100000; height:0}
.sheet li{position:relative; min-width:0; flex-grow:150; flex-basis:calc(1.5 * var(--rh))}
.frame{
  display:block; width:100%; padding:0; border:0; cursor:zoom-in; background:var(--sunk);
  aspect-ratio:3/2; max-width:100%; border-radius:1px; overflow:hidden; position:relative;
}
.frame img{width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .35s}
.frame img.in{opacity:1}
.frame .err{position:absolute; inset:0; display:grid; place-items:center; font-size:.75rem; color:var(--muted); padding:12px; text-align:center}
/* overlays sit on the photo itself, so they use fixed light-on-dark colours in both themes */
.fn{
  position:absolute; left:6px; bottom:6px; pointer-events:none;
  font-family:var(--mono); font-size:.6875rem; font-weight:500; line-height:1; letter-spacing:.04em;
  font-variant-numeric:tabular-nums; color:#F4F1EC; background:rgba(12,11,10,.58);
  padding:4px 6px; border-radius:3px;
}
.fdl{
  position:absolute; right:6px; top:6px; width:32px; height:32px; display:grid; place-items:center;
  border-radius:50%; background:rgba(12,11,10,.58); color:#F4F1EC; text-decoration:none;
  opacity:0; transition:opacity .15s;
}
.fdl svg{width:15px; height:15px}
.fdl:hover{background:#E8914A; color:#1A1208}
.sheet li:hover .fdl, .fdl:focus-visible{opacity:1}
@media (hover:none){ .fdl{display:none} }
.frames-head .tip{font-family:var(--mono); font-size:.6875rem; color:var(--muted); letter-spacing:.06em}
.roll-nav{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:48px 8px; margin-top:48px; border-top:1px solid var(--line)}
.roll-nav a{text-decoration:none; display:grid; gap:2px; max-width:48%}
.roll-nav a:last-child{text-align:right; margin-left:auto}
.roll-nav small{font-family:var(--mono); font-size:.6875rem; color:var(--muted); text-transform:uppercase; letter-spacing:.12em}
.roll-nav span{font-weight:600}
.roll-nav a:hover span{color:var(--accent)}

@media (max-width:760px){
  .roll-head{grid-template-columns:1fr}
  .actions{min-width:0}
  .sheet{--rh:112px; --gap:3px; margin-inline:-12px; padding-top:12px}
  .fn{left:4px; bottom:4px; font-size:.625rem; padding:3px 5px}
  .cs-img{min-height:140px}
  .roll-head{padding-block:14px 24px}
  .stock{font-size:clamp(2rem,9vw,2.6rem)}
  .roll-title{font-size:var(--step-0)}
  .desc{font-size:1rem}
  .specs{gap:20px}
  .btn{padding-block:13px}
  .cs{padding-bottom:28px}
  .roll-nav{flex-direction:column; padding-block:28px 0; margin-top:32px}
  .roll-nav a{max-width:100%}
  .roll-nav a:last-child{text-align:left; margin-left:0}
}

/* ---------- Loupe (single-frame viewer): always dark, by design ---------- */
#loupe{
  position:fixed; inset:0; z-index:50; background:#0D0C0B; color:#EDEAE4;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.l-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.l-bar .mono{color:#A39D93; text-transform:uppercase; letter-spacing:.12em; font-size:.6875rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.l-bar .mono b{color:#EDEAE4; font-weight:500}
.l-actions{display:flex; gap:8px; flex:none}
.l-btn{
  display:inline-flex; align-items:center; gap:6px; background:transparent; color:#EDEAE4;
  border:1px solid #3A3733; border-radius:4px; padding:8px 12px; font-size:.8125rem; font-weight:600;
  text-decoration:none; cursor:pointer;
}
.l-btn:hover{border-color:#EDEAE4}
.l-btn.dl{background:#E8914A; border-color:#E8914A; color:#1A1208}
.l-stage{position:relative; display:grid; place-items:center; min-height:0; padding:0 56px; touch-action:pan-y pinch-zoom}
.l-stage img{max-width:100%; max-height:100%; object-fit:contain; display:block; user-select:none; -webkit-user-drag:none}
.l-nav{
  position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px;
  background:transparent; border:0; color:#EDEAE4; cursor:pointer; font-size:1.5rem; opacity:.6;
}
.l-nav:hover{opacity:1}
.l-prev{left:max(4px,env(safe-area-inset-left,0px))}
.l-next{right:max(4px,env(safe-area-inset-right,0px))}
.l-foot{text-align:center; padding-block:10px 14px; font-family:var(--mono); font-size:.6875rem; color:#7D776E; letter-spacing:.12em; text-transform:uppercase}
@media (max-width:600px){ .l-stage{padding:0} .l-bar .mono .lf{display:none} .l-nav{display:none} .l-btn .t{display:none} }

.toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:6px; font-size:var(--step--1);
  z-index:60; max-width:calc(100% - 32px); box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
}

footer{padding-block:56px 40px; color:var(--muted); font-size:var(--step--1); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important; animation:none!important}
}
</style>

<body>
<header class="wrap top">
  <a class="brand" href="#" aria-label="Ronan Dsouza, film archive home">
    <svg viewBox="0 0 38 27" aria-hidden="true">
      <rect x="0" y="0" width="38" height="27" rx="2.5" fill="currentColor"/>
      <g fill="var(--paper)">
        <rect x="3" y="2" width="3" height="2.4" rx=".6"/><rect x="10" y="2" width="3" height="2.4" rx=".6"/><rect x="17.5" y="2" width="3" height="2.4" rx=".6"/><rect x="25" y="2" width="3" height="2.4" rx=".6"/><rect x="32" y="2" width="3" height="2.4" rx=".6"/>
        <rect x="3" y="22.6" width="3" height="2.4" rx=".6"/><rect x="10" y="22.6" width="3" height="2.4" rx=".6"/><rect x="17.5" y="22.6" width="3" height="2.4" rx=".6"/><rect x="25" y="22.6" width="3" height="2.4" rx=".6"/><rect x="32" y="22.6" width="3" height="2.4" rx=".6"/>
        <rect x="3" y="6.5" width="32" height="14" rx="1"/>
      </g>
      <text x="19" y="17.6" text-anchor="middle" fill="currentColor"
        style="font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:800;font-stretch:125%;font-size:10px;letter-spacing:.4px">RD</text>
    </svg>
    <span class="word"><b>Ronan Dsouza</b><small>Film archive · 35mm</small></span>
  </a>
  <div class="top-right">
    <span class="mono meta" id="topMeta"></span>
    <button class="theme" id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/>
      </svg>
    </button>
  </div>
</header>

<div class="wrap" id="demoNote" hidden>
  <p class="demo"><strong>Preview</strong> These are generated sample frames and contact sheets. Your scans from Google Drive appear here once the data link is added.</p>
</div>

<main id="view"></main>

<div id="loupe" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="l-bar">
    <span class="mono" id="lInfo"></span>
    <span class="l-actions">
      <a class="l-btn dl" id="lDl" href="#" target="_blank" rel="noopener"><span aria-hidden="true">↓</span><span class="t">Download</span></a>
      <button class="l-btn" id="lClose" type="button" aria-label="Close viewer">✕<span class="t">Close</span></button>
    </span>
  </div>
  <div class="l-stage" id="lStage">
    <button class="l-nav l-prev" id="lPrev" type="button" aria-label="Previous frame">←</button>
    <img id="lImg" alt="">
    <button class="l-nav l-next" id="lNext" type="button" aria-label="Next frame">→</button>
  </div>
  <div class="l-foot" id="lFoot">← → to browse · Esc to close</div>
</div>

<footer class="wrap">
  <span>Photographs © <span id="yr"></span> Ronan Dsouza. Shot on film, scanned, shared in full resolution.</span>
  <span class="mono" id="updated"></span>
</footer>

<script>
/* =========================================================
   SETTINGS
   Paste the web app URL from Google Apps Script between the quotes.
   Leave it empty to see the design with sample frames.
   ========================================================= */
const CONFIG = {
  DATA_URL: "https://script.google.com/macros/s/AKfycbz9M2A_WqBkx5fHbWXdN1vSwDsjkqmsU2XQgsuRW_Qo5DH0ix83JwsX5wW2ss3jmavn/exec"
};

/* ---------- Light / dark mode ---------- */
const root = document.documentElement;
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function storedTheme(){ try { return localStorage.getItem("rd-theme"); } catch (_) { return null; } }
function effectiveTheme(){ return root.dataset.theme || (darkQuery.matches ? "dark" : "light"); }
function syncThemeButton(){
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.getElementById("themeBtn").setAttribute("aria-label", `Switch to ${next} mode`);
}
(function initTheme(){
  const t = storedTheme();
  if (t === "dark" || t === "light") root.dataset.theme = t;
  syncThemeButton();
  darkQuery.addEventListener?.("change", syncThemeButton);
  new MutationObserver(syncThemeButton).observe(root, {attributes:true, attributeFilter:["data-theme"]});
})();
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("rd-theme", next); } catch (_) {}
});

/* ---------- Google Drive URLs ---------- */
const drive = {
  thumb: (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`,
  thumbAlt: (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`,
  download: id => `https://drive.google.com/uc?export=download&id=${id}`,
  folder: id => `https://drive.google.com/drive/folders/${id}`
};

/* ---------- State ---------- */
let ROLLS = [];
let DEMO = false;
let isoFilter = "All";
let current = null;     // roll being viewed
let loupeIndex = 0;
let loupeMode = "frames"; // or "contact"
let homeScroll = 0;

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_L = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2, "0");

function parseDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
  return m ? {y:+m[1], m:+m[2]-1, d:+m[3]} : null;
}
function shortDate(s){ const d = parseDate(s); return d ? `${pad(d.d)} ${MONTHS[d.m]}` : "—"; }
function longDate(s){ const d = parseDate(s); return d ? `${d.d} ${MONTHS_L[d.m]} ${d.y}` : "Date unknown"; }
function isoKey(r){ const n = parseInt(r.iso, 10); return n ? String(n) : ""; }

/* Box speed from the film name, so pushed or pulled rolls can be marked. */
function pushStops(film, iso){
  const speeds = [25,50,64,80,100,125,160,200,250,320,400,500,800,1600,3200];
  const found = [...String(film).matchAll(/(?<!\d)(\d{2,4})(?!\d)/g)].map(m => +m[1]).filter(n => speeds.includes(n));
  const box = found[found.length - 1], i = parseFloat(iso);
  if (!box || !i) return 0;
  return Math.round(Math.log2(i / box));
}
function pushLabel(stops){
  if (!stops) return "";
  return `<i class="push" title="${stops > 0 ? "Pushed" : "Pulled"} ${Math.abs(stops)} stop${Math.abs(stops) > 1 ? "s" : ""}">${stops > 0 ? "+" : "−"}${Math.abs(stops)}</i>`;
}

/* ---------- Data ---------- */
async function loadData(){
  if (!CONFIG.DATA_URL) { DEMO = true; return demoData(); }
  try {
    const res = await fetch(CONFIG.DATA_URL, {redirect:"follow"});
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (e) {
    return await jsonp(CONFIG.DATA_URL);
  }
}
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = "__rolls" + Date.now();
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("load failed")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}
function normalise(data){
  const rolls = (data.rolls || []).filter(r => r && ((r.photos && r.photos.length) || r.contact));
  rolls.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  rolls.forEach((r, i) => {
    r.no = i + 1;
    r.year = (parseDate(r.date) || {}).y || "Undated";
    r.photos = r.photos || [];
  });
  return rolls.reverse();  // newest first
}

/* ---------- Image loading ---------- */
const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); fill(e.target); } });
}, {rootMargin:"600px 0px"}) : null;

/* An <img> carries data-id and data-w (and data-pdf for PDF contact sheets). */
function fill(img){
  const id = img.dataset.id, w = +img.dataset.w, pdf = img.dataset.pdf === "1";
  img.onload = () => img.classList.add("in");
  if (DEMO) { img.src = demoImage(id, w); return; }
  const first = pdf ? drive.thumbAlt(id, w) : drive.thumb(id, w);
  const second = pdf ? drive.thumb(id, w) : drive.thumbAlt(id, w);
  img.onerror = () => {
    if (!img.dataset.retry) { img.dataset.retry = 1; img.src = second; }
    else {
      img.onerror = null;
      const box = img.parentElement;
      if (box && !box.querySelector(".err")) box.insertAdjacentHTML("beforeend", `<span class="err">Couldn't load this image. Check the roll's folder is shared publicly.</span>`);
    }
  };
  img.src = first;
}
function lazy(img, eager){
  if (eager || !io) fill(img); else io.observe(img);
}

/* ---------- Home ---------- */
function renderHome(){
  current = null;
  const frames = ROLLS.reduce((n, r) => n + r.photos.length, 0);
  const years = ROLLS.map(r => r.year).filter(y => typeof y === "number");
  const span = years.length ? (Math.min(...years) === Math.max(...years) ? Math.max(...years) : `${Math.min(...years)}–${Math.max(...years)}`) : "";
  $("#topMeta").textContent = span ? `${ROLLS.length} rolls · ${span}` : "";

  const isos = {};
  ROLLS.forEach(r => { const k = isoKey(r); if (k) isos[k] = (isos[k] || 0) + 1; });
  const isoList = Object.entries(isos).sort((a, b) => +a[0] - +b[0]);
  const stocks = new Set(ROLLS.map(r => r.film).filter(Boolean)).size;
  if (isoFilter !== "All" && !isos[isoFilter]) isoFilter = "All";
  const shown = ROLLS.filter(r => isoFilter === "All" || isoKey(r) === isoFilter);

  const byYear = [];
  shown.forEach(r => {
    let g = byYear.find(x => x.year === r.year);
    if (!g) byYear.push(g = {year:r.year, rolls:[]});
    g.rolls.push(r);
  });

  view.innerHTML = `
    <section class="wrap intro">
      <h1>Every roll, <em>frame by frame.</em></h1>
      <p>Photographs I've shot on film, scanned and kept in one place. Open a roll to see its contact sheet and download any frame at full resolution. No account needed.</p>
      <div class="stats mono">
        <span><b>${ROLLS.length}</b> rolls</span>
        <span><b>${frames}</b> frames</span>
        <span><b>${stocks}</b> film stocks</span>
      </div>
    </section>
    <div class="wrap">
      <hr class="rule">
      ${isoList.length > 1 ? `
      <div class="filters" role="group" aria-label="Filter rolls by ISO">
        <span class="lbl">Shot at ISO</span>
        <button class="chip" type="button" data-f="All" aria-pressed="${isoFilter === "All"}">All<span class="n">${ROLLS.length}</span></button>
        ${isoList.map(([k, n]) => `<button class="chip" type="button" data-f="${esc(k)}" aria-pressed="${isoFilter === k}">${esc(k)}<span class="n">${n}</span></button>`).join("")}
      </div>` : ""}
      ${byYear.length ? byYear.map(g => `
        <section class="year">
          <h2>${esc(g.year)}<span>${g.rolls.length} roll${g.rolls.length > 1 ? "s" : ""}</span></h2>
          <ol class="rolls">
            ${g.rolls.map(r => `
              <li><a class="roll" href="#roll-${esc(r.id)}">
                <span class="r-no">No.&nbsp;${pad(r.no)}</span>
                <span class="r-date">${shortDate(r.date)}</span>
                <span class="r-film">${esc(r.film || "Unknown film")}${r.title ? `<em>${esc(r.title)}</em>` : ""}</span>
                <span class="r-iso">${r.iso ? `ISO ${esc(r.iso)}${pushLabel(pushStops(r.film, r.iso))}` : ""}</span>
                <span class="r-cam">${esc(r.camera)}</span>
                <span class="r-fr">${r.photos.length} fr</span>
                <span class="r-go" aria-hidden="true">→</span>
              </a></li>`).join("")}
          </ol>
        </section>`).join("") : `<p class="empty">No rolls to show yet.</p>`}
    </div>`;

  view.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    isoFilter = b.dataset.f; renderHome();
  }));
}

/* ---------- Roll page ---------- */
function renderRoll(r){
  current = r;
  const idx = ROLLS.indexOf(r);
  const newer = ROLLS[idx - 1], older = ROLLS[idx + 1];
  const stops = pushStops(r.film, r.iso);
  const filmUp = (r.film || "Film").toUpperCase();
  let edge = "";
  for (let i = 1; i <= Math.max(r.photos.length, 24); i++) edge += `${i} ▸ ${i}A ▸ ${i % 6 === 1 ? filmUp + " ▸ " : ""}`;
  const c = r.contact;
  const link = id => DEMO ? "#" : id;

  view.innerHTML = `
    <div class="wrap">
      <a class="back" href="#"><span aria-hidden="true">←</span> All rolls</a>
      <header class="roll-head">
        <div>
          <p class="eyebrow mono">Roll No. ${pad(r.no)} · ${longDate(r.date)}</p>
          <h1 class="stock">${esc(r.film || "Unknown film")}</h1>
          ${r.title ? `<p class="roll-title">${esc(r.title)}</p>` : ""}
          ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ""}
          <dl class="specs">
            ${r.iso ? `<div><dt>Shot at</dt><dd>ISO ${esc(r.iso)}${stops ? `<span class="pp">${stops > 0 ? "push +" : "pull −"}${Math.abs(stops)}</span>` : ""}</dd></div>` : ""}
            ${r.camera ? `<div><dt>Camera</dt><dd>${esc(r.camera)}</dd></div>` : ""}
            <div><dt>Frames</dt><dd>${r.photos.length}</dd></div>
          </dl>
        </div>
        <div class="actions">
          ${r.zip
            ? `<a class="btn primary" href="${link(drive.download(r.zip))}" target="_blank" rel="noopener" data-demo-dl>↓ Download whole roll</a>
               <a class="btn" href="${link(drive.folder(r.id))}" target="_blank" rel="noopener" data-demo-dl>Open in Google Drive</a>`
            : `<a class="btn primary" href="${link(drive.folder(r.id))}" target="_blank" rel="noopener" data-demo-dl>↓ Download whole roll</a>
               <p class="hint">Opens the roll in Google Drive. Use Drive's Download button to get every frame as one zip.</p>`}
        </div>
      </header>

      ${c ? `
      <section class="cs" aria-labelledby="csTitle">
        <div class="cs-bar">
          <h2 id="csTitle">Contact sheet <span>· ${esc(r.film)}${c.type === "pdf" ? " · PDF" : ""}</span></h2>
          <a class="btn sm" href="${link(drive.download(c.id))}" target="_blank" rel="noopener" data-demo-dl>↓ Download contact sheet</a>
        </div>
        <button class="cs-img" type="button" id="csOpen" aria-label="View the contact sheet larger"
          ${c.w && c.h ? `style="aspect-ratio:${c.w}/${c.h}"` : ""}>
          <img alt="Contact sheet for ${esc(r.film)}, ${esc(longDate(r.date))}" data-id="${esc(c.id)}" data-w="1800" ${c.type === "pdf" ? 'data-pdf="1"' : ""} decoding="async">
        </button>
      </section>` : ""}

      ${r.photos.length ? `
      <section class="frames" aria-labelledby="frTitle">
        <div class="frames-head"><h2 id="frTitle">Frames <span style="color:var(--muted);font-weight:400">· ${r.photos.length}</span></h2><span class="tip">${matchMedia("(hover:none)").matches ? "Tap" : "Click"} a frame to view or download</span></div>
        <div class="edge" aria-hidden="true">${esc(edge)}</div>
        <ol class="sheet">
          ${r.photos.map((p, i) => `
            <li style="${ratioStyle(ratioOf(p))}">
              <button class="frame" type="button" data-i="${i}" aria-label="Open frame ${i + 1}" style="aspect-ratio:${ratioOf(p).toFixed(4)}">
                <img alt="Frame ${i + 1}, ${esc(r.film)}" data-id="${esc(p.id)}" data-w="640" decoding="async" loading="lazy">
              </button>
              <span class="fn" aria-hidden="true">${pad(i + 1)}</span>
              <a class="fdl" href="${link(drive.download(p.id))}" target="_blank" rel="noopener" data-demo-dl aria-label="Download frame ${i + 1}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
              </a>
            </li>`).join("")}
        </ol>
      </section>` : ""}

      <nav class="roll-nav" aria-label="More rolls">
        ${older ? `<a href="#roll-${esc(older.id)}"><small>← Previous roll · ${shortDate(older.date)} ${older.year}</small><span>${esc(older.film)}</span></a>` : "<span></span>"}
        ${newer ? `<a href="#roll-${esc(newer.id)}"><small>Next roll · ${shortDate(newer.date)} ${newer.year} →</small><span>${esc(newer.film)}</span></a>` : ""}
      </nav>
    </div>`;

  const csImg = view.querySelector(".cs-img img");
  if (csImg) lazy(csImg, true);
  $("#csOpen")?.addEventListener("click", e => openLoupe(0, e.currentTarget, "contact"));
  view.querySelectorAll(".sheet img").forEach((img, i) => {
    // once a frame loads, fit its tile to the photo's real shape (no cropping)
    img.addEventListener("load", () => {
      if (!img.naturalWidth || !img.naturalHeight) return;
      const ratio = img.naturalWidth / img.naturalHeight;
      const li = img.closest("li");
      li.style.cssText = ratioStyle(ratio);
      img.parentElement.style.aspectRatio = ratio.toFixed(4);
    });
    lazy(img, i < (c ? 6 : 12));
  });
  view.querySelectorAll(".frame").forEach(b => b.addEventListener("click", () => openLoupe(+b.dataset.i, b, "frames")));
  bindDemoLinks(view);
}

/* Justified photo wall: each tile grows in proportion to its photo's width/height. */
function ratioOf(p){ return p.w && p.h ? p.w / p.h : 1.5; }
function ratioStyle(r){ return `flex-grow:${(r * 100).toFixed(2)};flex-basis:calc(${r.toFixed(4)} * var(--rh))`; }

/* ---------- Loupe ---------- */
const loupe = $("#loupe"), lImg = $("#lImg");
let lastFocus = null;
function openLoupe(i, from, mode){
  lastFocus = from || document.activeElement;
  loupeMode = mode;
  const single = mode === "contact" || current.photos.length < 2;
  $("#lPrev").hidden = $("#lNext").hidden = single;
  const touch = matchMedia("(hover:none)").matches;
  $("#lFoot").textContent = single ? (touch ? "Pinch to zoom" : "Esc to close") : (touch ? "Swipe to browse" : "← → to browse · Esc to close");
  loupe.hidden = false;
  document.documentElement.style.overflow = "hidden";
  if (mode === "contact") showContact(); else showFrame(i);
  $("#lClose").focus();
}
function closeLoupe(){
  loupe.hidden = true;
  document.documentElement.style.overflow = "";
  lImg.removeAttribute("src");
  if (lastFocus) lastFocus.focus();
}
function swapLarge(id, guard, pdf){
  if (DEMO) { requestAnimationFrame(() => { if (guard()) lImg.src = demoImage(id, 1800); }); return; }
  const urls = pdf ? [drive.thumbAlt(id, 2400), drive.thumb(id, 2400)] : [drive.thumb(id, 2400), drive.thumbAlt(id, 2400)];
  const big = new Image();
  big.onload = () => { if (guard()) lImg.src = big.src; };
  big.onerror = () => { const b2 = new Image(); b2.onload = () => { if (guard()) lImg.src = b2.src; }; b2.src = urls[1]; };
  big.src = urls[0];
}
function showContact(){
  const r = current, c = r.contact;
  $("#lInfo").innerHTML = `<b>Contact sheet</b><span class="lf"> · ${esc(r.film)} · ${shortDate(r.date)} ${esc(r.year)}</span>`;
  $("#lDl").href = DEMO ? "#" : drive.download(c.id);
  lImg.alt = `Contact sheet for ${r.film}`;
  lImg.src = DEMO ? demoImage(c.id, 1800) : (c.type === "pdf" ? drive.thumbAlt(c.id, 1800) : drive.thumb(c.id, 1800));
  swapLarge(c.id, () => loupeMode === "contact" && current === r, c.type === "pdf");
}
function showFrame(i){
  const r = current; if (!r) return;
  const n = r.photos.length;
  loupeIndex = (i + n) % n;
  const p = r.photos[loupeIndex];
  $("#lInfo").innerHTML = `<b>${pad(loupeIndex + 1)}</b> / ${pad(n)}<span class="lf"> · ${esc(r.film)} · ${shortDate(r.date)} ${esc(r.year)}</span>`;
  $("#lDl").href = DEMO ? "#" : drive.download(p.id);
  lImg.alt = `Frame ${loupeIndex + 1}, ${r.film}`;
  lImg.src = DEMO ? demoImage(p.id, 640) : drive.thumb(p.id, 640);
  swapLarge(p.id, () => loupeMode === "frames" && r.photos[loupeIndex] === p, false);
  if (!DEMO) [1, -1].forEach(d => { const q = r.photos[(loupeIndex + d + n) % n]; new Image().src = drive.thumb(q.id, 2400); });
}
function step(d){ if (loupeMode === "frames" && current && current.photos.length > 1) showFrame(loupeIndex + d); }
$("#lClose").addEventListener("click", closeLoupe);
$("#lPrev").addEventListener("click", () => step(-1));
$("#lNext").addEventListener("click", () => step(1));
$("#lDl").addEventListener("click", e => { if (DEMO) { e.preventDefault(); demoToast(); } });
document.addEventListener("keydown", e => {
  if (loupe.hidden) return;
  if (e.key === "Escape") closeLoupe();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "Tab") { // keep focus inside the viewer
    const f = [...loupe.querySelectorAll("a,button")].filter(x => x.offsetParent);
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let sx = null;
$("#lStage").addEventListener("pointerdown", e => { sx = e.clientX; });
$("#lStage").addEventListener("pointerup", e => {
  if (sx === null) return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

/* ---------- Routing (#roll-ID) ---------- */
function route(){
  if (!loupe.hidden) closeLoupe();
  routeTo(location.hash);
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || a.target === "_blank") return;
  const h = a.getAttribute("href");
  e.preventDefault();
  try { if (location.hash !== h) history.pushState(null, "", h === "#" ? location.pathname + location.search : h); } catch (_) {}
  routeTo(h);
});
function routeTo(h){
  const m = /^#roll-([\w.~-]+)$/.exec(h);
  const r = m && ROLLS.find(x => x.id === m[1]);
  if (r) { if (!current) homeScroll = scrollY; renderRoll(r); scrollTo(0, 0); }
  else { const was = !!current; renderHome(); if (was) requestAnimationFrame(() => scrollTo(0, homeScroll)); }
}
addEventListener("popstate", route);
addEventListener("hashchange", route);

/* ---------- Demo helpers ---------- */
let toastEl = null, toastT = null;
function demoToast(){
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
  toastEl.textContent = "Sample image. Downloads link to Google Drive once your rolls are connected.";
  toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 3200);
}
function bindDemoLinks(root){
  if (!DEMO) return;
  root.querySelectorAll("[data-demo-dl]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); demoToast(); }));
}

function demoData(){
  const stocks = [
    ["Kodak Portra 400","portra"],["Kodak Portra 160","portra"],["Kodak Ektar 100","ektar"],["Kodak Gold 200","gold"],
    ["Ilford HP5 Plus 400","bw"],["Kodak Tri-X 400","bw"],["CineStill 800T","cine"],["Fujifilm Superia X-TRA 400","fuji"],
    ["Ilford Delta 3200","bw"],["Kodak ColorPlus 200","gold"]
  ];
  const cams = ["Nikon FM2","Olympus OM-1","Canon AE-1 Program","Contax T2","Pentax K1000"];
  const titles = ["Coastal walk","Night tram","Market morning","Rain in the city","Back roads","Harbour at dusk","Weekend away","Old town","Sunday swim","Winter light","Late shift","Long weekend","Bus window","Ferry crossing","Rooftops","The garden","Fog","Neon","Salt and sand","Road trip","Studio days","Last light"];
  const descs = [
    "Shot over three evenings as the light went orange. Most frames are a stop overexposed on purpose, which Portra handles well.\nDeveloped and scanned at a local lab.",
    "A slow walk along the coast with one roll and no plan. The last few frames caught the fog rolling in.",
    "Pushed two stops for the low light. Expect heavy grain and deep blacks.",
    "Mostly people and markets, shot from the hip."
  ];
  const rand = rng(7);
  const rolls = [];
  let t = Date.UTC(2024, 2, 9);
  for (let i = 0; i < 22; i++) {
    const [film, look] = stocks[Math.floor(rand() * stocks.length)];
    let iso = (film.match(/(\d{2,4})(?!.*\d)/) || [,"400"])[1];
    if (look === "bw" && rand() < .4) iso = String(+iso * 4 > 3200 ? 3200 : +iso * 4);
    const n = 24 + Math.floor(rand() * 14);
    const d = new Date(t);
    const id = `demo${i}`;
    rolls.push({
      id, film, iso, camera: cams[Math.floor(rand() * cams.length)], title: titles[i],
      description: rand() < .6 ? descs[Math.floor(rand() * descs.length)] : "",
      date: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`,
      look, zip: i % 3 === 0 ? "demo-zip" : "",
      contact: i % 5 === 3 ? null : {id:`${id}cs`, type:"image"},
      photos: Array.from({length:n}, (_, k) => ({id:`${id}f${k}`}))
    });
    t += (22 + Math.floor(rand() * 40)) * 864e5;
  }
  DEMO_ROLLS = Object.fromEntries(rolls.map(r => [r.id, r]));
  return {updated: new Date().toISOString(), rolls};
}
let DEMO_ROLLS = {};

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const demoCache = new Map();
function demoImage(id, w){
  const key = id + "@" + w;
  if (demoCache.has(key)) return demoCache.get(key);
  const c = /cs$/.test(id) ? demoContactCanvas(id.slice(0, -2), w) : demoFrameCanvas(id, w);
  const url = c.toDataURL("image/jpeg", .84);
  demoCache.set(key, url);
  return url;
}

/* A lab-style contact sheet: strips of six frames on paper, edge print in the rebate. */
function demoContactCanvas(rollId, w){
  const r = DEMO_ROLLS[rollId];
  const n = r.photos.length, per = 6, rows = Math.ceil(n / per);
  const W = w, margin = W * .045, gap = W * .018;
  const fw = (W - margin * 2) / per, fh = fw * 2 / 3, reb = fh * .2;
  const stripH = fh + reb * 2;
  const H = Math.round(margin * 2 + rows * stripH + (rows - 1) * gap + margin * .5);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#F4F2EE"; g.fillRect(0, 0, W, H);
  const edgeCol = r.look === "bw" ? "rgba(225,225,220,.75)" : "rgba(240,150,70,.9)";
  for (let row = 0; row < rows; row++) {
    const y = margin + row * (stripH + gap);
    g.fillStyle = r.look === "bw" ? "#141414" : "#2A160C";
    g.fillRect(margin - fw * .04, y, fw * per + fw * .08, stripH);
    // sprocket holes
    g.fillStyle = "#F4F2EE";
    for (let x = margin; x < margin + fw * per; x += fw / 8) {
      g.fillRect(x + fw * .02, y + reb * .18, fw * .055, reb * .38);
      g.fillRect(x + fw * .02, y + stripH - reb * .56, fw * .055, reb * .38);
    }
    g.font = `500 ${Math.max(7, reb * .32)}px "IBM Plex Mono", monospace`;
    g.fillStyle = edgeCol;
    for (let k = 0; k < per; k++) {
      const idx = row * per + k;
      if (idx >= n) break;
      const x = margin + k * fw;
      const fc = demoFrameCanvas(r.photos[idx].id, Math.round(fw * 1.2), true);
      const iw = fw * .94, ih = fh * .92;
      g.drawImage(fc, x + (fw - iw) / 2, y + reb + (fh - ih) / 2, iw, ih);
      g.fillText(`▸${idx + 1}`, x + fw * .1, y + stripH - reb * .7);
      g.fillText(`${idx + 1}A`, x + fw * .62, y + stripH - reb * .7);
      if (k === 0) g.fillText(r.film.toUpperCase(), x + fw * .1, y + reb * .9);
    }
  }
  return cv;
}

/* A believable film-like frame: sky, sun, hills, grain, vignette, stock tint. */
function demoFrameCanvas(id, w, forceLandscape){
  const roll = DEMO_ROLLS[id.replace(/f\d+$/, "")] || {};
  const look = roll.look || "portra", iso = +roll.iso || 400;
  const R = rng(hash(id));
  const portrait = R() < .22 && !forceLandscape;
  const W = portrait ? Math.round(w * 2 / 3) : w, H = portrait ? w : Math.round(w * 2 / 3);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const night = look === "cine" ? R() < .8 : R() < .12;
  const golden = !night && R() < .45;
  const hue = 190 + R() * 30;
  const sky = g.createLinearGradient(0, 0, 0, H);
  if (night) { sky.addColorStop(0, `hsl(${hue+20} 45% 8%)`); sky.addColorStop(1, `hsl(${hue} 40% 22%)`); }
  else if (golden) { sky.addColorStop(0, `hsl(${hue} 45% 62%)`); sky.addColorStop(.7, `hsl(${30 + R()*15} 75% 72%)`); sky.addColorStop(1, `hsl(${20 + R()*10} 80% 66%)`); }
  else { sky.addColorStop(0, `hsl(${hue} 55% ${48 + R()*12}%)`); sky.addColorStop(1, `hsl(${hue - 10} 40% 84%)`); }
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const hz = H * (.45 + R() * .25);
  const sxp = W * (.15 + R() * .7), syp = hz - H * (.05 + R() * .25), sr = Math.max(W, H) * (.04 + R() * .05);
  const glow = g.createRadialGradient(sxp, syp, 0, sxp, syp, sr * 6);
  glow.addColorStop(0, night ? "rgba(255,240,220,.9)" : "rgba(255,248,225,1)");
  glow.addColorStop(.18, night ? "rgba(255,220,180,.25)" : "rgba(255,226,170,.55)");
  glow.addColorStop(1, "rgba(255,220,170,0)");
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  const layers = 2 + Math.floor(R() * 3);
  for (let L = 0; L < layers; L++) {
    const base = hz + (H - hz) * (L / layers) * .8;
    const amp = H * (.05 + R() * .12) * (1 - L / (layers + 1));
    const light = night ? 6 + L * 3 : golden ? 30 - L * 7 : 38 - L * 8;
    g.fillStyle = `hsl(${golden ? 25 + L * 6 : 100 + R() * 80} ${night ? 20 : 25 + R() * 20}% ${Math.max(6, light)}%)`;
    g.beginPath(); g.moveTo(0, H);
    let y = base - amp * R();
    for (let x = 0; x <= W; x += W / 24) { y += (R() - .5) * amp * .5; y = Math.min(base + amp, Math.max(base - amp, y)); g.lineTo(x, y); }
    g.lineTo(W, H); g.closePath(); g.fill();
  }
  const posts = Math.floor(R() * 6);
  g.fillStyle = night ? "rgba(5,5,8,.9)" : "rgba(20,18,16,.75)";
  for (let k = 0; k < posts; k++) {
    const x = R() * W, pw = W * (.004 + R() * .03), ph = H * (.15 + R() * .5);
    g.fillRect(x, hz + H * .1 - ph, pw, ph + H);
  }
  if (night) {
    for (let k = 0; k < 6 + R() * 10; k++) {
      const x = R() * W, y = hz - R() * H * .25 + H * .1, r = W * (.004 + R() * .006);
      const hg = g.createRadialGradient(x, y, 0, x, y, r * 9);
      hg.addColorStop(0, "rgba(255,245,225,1)"); hg.addColorStop(.15, "rgba(255,120,70,.55)"); hg.addColorStop(1, "rgba(255,60,40,0)");
      g.fillStyle = hg; g.fillRect(x - r * 9, y - r * 9, r * 18, r * 18);
    }
  }
  const img = g.getImageData(0, 0, W, H), d = img.data;
  const grain = Math.min(34, 6 + iso / 90) * (W > 900 ? 1 : .8);
  const cx = W / 2, cy = H / 2, md = Math.hypot(cx, cy);
  let seed = hash(id) || 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    let r = d[i], gg = d[i + 1], b = d[i + 2];
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    const n = ((seed >>> 0) / 4294967296 - .5) * grain;
    if (look === "bw") { let l = .3 * r + .59 * gg + .11 * b; l = (l - 128) * 1.25 + 128; r = gg = b = l; }
    else {
      const l = (r + gg + b) / 3;
      const s = look === "ektar" ? 1.3 : look === "portra" ? .85 : look === "cine" ? 1 : 1.05;
      r = l + (r - l) * s; gg = l + (gg - l) * s; b = l + (b - l) * s;
      if (look === "portra") { r = r * .96 + 14; gg = gg * .96 + 9; b = b * .92 + 6; }
      else if (look === "gold") { r += 14; gg += 7; b -= 12; }
      else if (look === "fuji") { gg += 8; b += 4; r -= 4; }
      else if (look === "cine") { b += (255 - l) * .06; r -= 4; }
    }
    const v = 1 - Math.pow(Math.hypot(x - cx, y - cy) / md, 2.2) * .45;
    d[i] = (r + n) * v; d[i + 1] = (gg + n) * v; d[i + 2] = (b + n) * v;
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* ---------- Start ---------- */
$("#yr").textContent = new Date().getFullYear();
view.innerHTML = `<p class="wrap empty mono">Loading rolls…</p>`;
loadData().then(data => {
  ROLLS = normalise(data);
  $("#demoNote").hidden = !DEMO;
  if (data.updated && !DEMO) {
    const u = new Date(data.updated);
    $("#updated").textContent = `Updated ${u.getDate()} ${MONTHS[u.getMonth()]} ${u.getFullYear()}`;
  }
  route();
}).catch(() => {
  view.innerHTML = `<div class="wrap"><p class="empty">The rolls couldn't be loaded. Check that the Apps Script web app is deployed with access set to "Anyone", and that its URL in this page's settings is correct.</p></div>`;
});
</script>
